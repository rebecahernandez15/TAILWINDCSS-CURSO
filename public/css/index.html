<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./main.css">
</head>
<body>

    <!-- El fondo naranja se aplica solo a esta franja -->
    <!--<div class=" bg-yellow-500 hover:bg-pink-500 hover:text-green-500 text-blue-500 text-5xl font-bold text-center py-5 pt-20">
        hello world
    </div>
    -->

        <div class="w-[1920px] xsm:w-full mx-auto">
            <nav class="bg-gray-800 flex justify-between lg:justify-start items-center">
                <div class="logo p-2 w-1/6">
                    <img src="../../img/logo.png" width="100" alt="Logo">
                </div>
                <div class="links lg:block hidden w-1/6 md:w-4/6">
                    <ul class="menu flex items-center justify-center gap-5" >
                        <li><a href="#" class="link" >Home</a></li>
                        <li><a href="#" class="link">Play Together</a></li>
                        <li><a href="#" class="link">Explore</a></li>
                        <li><a href="#" class="border-4 border-red-600 text-white font-bold p-2 rounded-full hover:bg-white hover:text-black transition duration-500"">Green Goblin</a></li>
                        <li><a href="#" class="rounded-full bg-green-600 text-white font-bold px-4 py-3 hover:text-black hover:bg-white transition-500">Buy Now</a></li>
                    </ul>
                </div>

                <div class="block lg:hidden w-1/6 lg:w-4/6 ">
                    <a href="#" class="link" id="mobile-menu">Menu</a>
                    <ul class="mobile-links hidden w-full absolute z-50 left-0 text-center bg-gray-800" >
                        <li><a href="#" class="link" >Home</a></li>
                        <li><a href="#" class="link">Play Together</a></li>
                        <li><a href="#" class="link">Explore</a></li>
                        <li><a href="#" class="my-4 inline-block border-4 border-red-600 text-white font-bold p-2 rounded-full hover:bg-white hover:text-black transition duration-500"">Green Goblin</a></li>
                        <li><a href="#" class="my-4 inline-block border-4 rounded-full bg-green-600 text-white font-bold px-4 py-3 hover:text-black hover:bg-white transition-500">Buy Now</a></li>
                    </ul>
                </div>
            </nav>

            <section class="header">
                <img src="../../img/hero.jpg" alt="">
            </section>

            <div class="bg-wave-pattern bg-repeat-x h-16 w-full bg-gray-800"></div>

            <section class="bg-wave-pattern-dots bg-repeat py-12 px-4 relative">
                <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-center gap-6">
                    <a href="#" class="inline-block py-3 px-16 bg-red-900 text-white font-bold border-transaparente border-8 text-2xl rounded-3xl hover: border-gray-200  hover:bg-white hover:text-black transition duration-200 ">
                        Buy Now
                    </a>
                    <a href="#" class="inline-block py-3 px-16 bg-blue-800 text-white font-bold border-transaparente border-8 text-2xl rounded-3xl hover: border-gray-200  hover:bg-white hover:text-black transition duration-200 ">
                        Watch the Trailer
                    </a>
                </div>
                <div class="bg-wave-pattern-dots bg-repeat py-12 px-4 relative"></div>
            </section>

            <section class = "bg-red-700 h-9 py28"></section>

        </div>

        <script>
        const menuButton = document.querySelector('#mobile-menu');

        menuButton.addEventListener('click', (e) => {
            e.preventDefault();
            const menu = document.querySelector('.mobile-links');
            menu.classList.toggle('hidden');
        });
        </script>

</body>
</html>
